<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background diagonal gradient matching reference #5B6CF0 -> #00D2FF -->
    <linearGradient id="lbSquircleGrad" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#5B6CF0"/>
      <stop offset="28%" stop-color="#4F76EB"/>
      <stop offset="65%" stop-color="#2D95E1"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>

    <!-- Subtle inner glass specular sheen -->
    <linearGradient id="lbSheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient glow filter -->
    <filter id="lbAmbientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4F76EB" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00D2FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g shape-rendering="geometricPrecision">
    <!-- Squircle Body with subtle ambient shadow -->
    <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#lbSquircleGrad)" filter="url(#lbAmbientGlow)"/>
    <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#lbSquircleGrad)"/>

    <!-- Subtle Top-Half Glass Sheen -->
    <path d="M 5,31 C 5,16.6 16.6,5 31,5 L 69,5 C 83.4,5 95,16.6 95,31 L 95,48 C 75,54 25,54 5,48 Z" fill="url(#lbSheenGrad)"/>

    <!-- Refined Inner Border Highlight -->
    <rect x="5.5" y="5.5" width="89" height="89" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.2"/>
  </g>

  <!-- Pixel-Perfect 'LB' Monogram (Stepped 25x17 pixel grid from reference image) -->
  <g transform="translate(20, 29.6) scale(2.4)" fill="#FFFFFF" shape-rendering="crispEdges">
    <path d="M0 0h3v1h-3z M11 0h11v1h-11z M0 1h3v1h-3z M11 1h13v1h-13z M0 2h3v1h-3z M11 2h13v1h-13z M0 3h3v1h-3z M13 3h3v1h-3z M21 3h4v1h-4z M0 4h3v1h-3z M13 4h3v1h-3z M22 4h3v1h-3z M0 5h3v1h-3z M13 5h3v1h-3z M22 5h3v1h-3z M0 6h3v1h-3z M13 6h3v1h-3z M21 6h3v1h-3z M0 7h3v1h-3z M13 7h11v1h-11z M0 8h3v1h-3z M13 8h9v1h-9z M0 9h3v1h-3z M13 9h11v1h-11z M0 10h3v1h-3z M13 10h3v1h-3z M21 10h4v1h-4z M0 11h3v1h-3z M13 11h3v1h-3z M22 11h3v1h-3z M0 12h3v1h-3z M13 12h3v1h-3z M22 12h3v1h-3z M0 13h3v1h-3z M13 13h3v1h-3z M21 13h4v1h-4z M0 14h10v1h-10z M11 14h14v1h-14z M0 15h10v1h-10z M11 15h13v1h-13z M0 16h10v1h-10z M11 16h11v1h-11z"/>
  </g>
</svg>
